version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      cloudflare-workers-sdk:
        patterns:
          - "@cloudflare/vitest-pool-workers"
          - "@cloudflare/workers-types"
          - wrangler
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      oxc-tooling:
        patterns:
          - oxfmt
          - oxlint
          - oxlint-tsgolint
