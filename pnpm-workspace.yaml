packages:
  - "packages/*"
  - "workers/*"

autoInstallPeers: false
strictPeerDependencies: false
engineStrict: true
minimumReleaseAge: 4320

# Explicit version selection and CI enforce the manifest pin; keep GitHub-compatible lockfiles.
pmOnFail: ignore
autoDedupe: true
lockfile:
  includeResolutionSettings: true
verifyDepsBeforeRun: error

allowBuilds:
  esbuild: false
  workerd: false
strictDepBuilds: true

# GHSA-xjj6-f33q-929c: remove when Miniflare selects a patched Undici version.
overrides:
  "miniflare>undici@7.29.1": "7.30.1"
